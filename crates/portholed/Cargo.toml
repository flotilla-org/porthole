[package]
name = "portholed"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "portholed"

[dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
futures-core = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
porthole-core = { path = "../porthole-core" }
porthole-protocol = { path = "../porthole-protocol" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"
capture-transfer = { path = "../capture-transfer" }

[target.'cfg(target_os = "macos")'.dependencies]
porthole-adapter-macos = { path = "../porthole-adapter-macos" }
# Native IOSurface/Metal capture + XPC attach server (the feature unions onto
# the base capture-transfer dep on macOS).
capture-transfer = { path = "../capture-transfer", features = ["backend-macos"] }

[target.'cfg(target_os = "linux")'.dependencies]
porthole-adapter-kwin = { path = "../porthole-adapter-kwin" }
zbus = { workspace = true }

[dev-dependencies]
tempfile = "3"
porthole = { path = "../porthole" }

[[bin]]
name = "portholed"
path = "src/main.rs"

[lints]
workspace = true
