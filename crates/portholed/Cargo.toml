[package]
name = "portholed"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
default-run = "portholed"

[dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
futures-core = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
porthole-core = { path = "../porthole-core" }
porthole-protocol = { path = "../porthole-protocol" }
porthole-transport = { path = "../porthole-transport" }
jackstay-graph = { workspace = true }
jackstay-bridge = { path = "../jackstay-bridge" }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"
jackstay = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
porthole-adapter-macos = { path = "../porthole-adapter-macos" }
# Native IOSurface/Metal capture + XPC attach server (the feature unions onto
# the base Jackstay dependency on macOS).
jackstay = { workspace = true, features = ["backend-macos"] }

[target.'cfg(target_os = "linux")'.dependencies]
porthole-adapter-kwin = { path = "../porthole-adapter-kwin" }
# Native dmabuf/DRM/PipeWire attach path for Linux.
jackstay = { workspace = true, features = ["backend-linux"] }
zbus = { workspace = true }

[target.'cfg(windows)'.dependencies]
porthole-adapter-windows = { path = "../porthole-adapter-windows" }
# Windows.Graphics.Capture handoff (#186): Porthole creates the capture item
# for an authorized window and Jackstay's D3D11 backend runs the session.
jackstay = { workspace = true, features = ["backend-windows"] }
# Same windows-rs release as Jackstay's backend; only names its HWND and
# capture item types.
windows = { version = "0.62.2", features = ["Graphics_Capture", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
porthole = { path = "../porthole" }

[target.'cfg(windows)'.dev-dependencies]
# A test-owned window for the ignored live native capture test.
windows = { version = "0.62.2", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
porthole-adapter-macos = { path = "../porthole-adapter-macos" }
jackstay = { workspace = true, features = ["backend-macos"] }

[[bin]]
name = "portholed"
path = "src/main.rs"

[lints]
workspace = true
