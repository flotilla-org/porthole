[package]
name = "jackstay-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-host Jackstay bridge: an egress half that encodes a local publication and an ingress half that republishes it"

[features]
# Enable the working macOS bridge in normal Porthole workspace/bundle builds.
# The backend is target-gated, so portable code still builds on other platforms.
default = ["backend-macos"]
backend-macos = ["dep:cc", "jackstay/backend-macos"]

[build-dependencies]
cc = { version = "1", optional = true }

[dependencies]
jackstay = { workspace = true }
jackstay-graph = { workspace = true }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[[bin]]
name = "jackstay-bridge"
path = "src/bin/jackstay-bridge.rs"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
