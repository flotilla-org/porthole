[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Drift guard only: the bundled daemon plist must declare the same MachService
# name that portholed advertises via MACOS_NATIVE_ATTACH_MACH_SERVICE.
porthole-protocol = { path = "../porthole-protocol" }

[lib]
name = "xtask"
path = "src/lib.rs"

[lints]
workspace = true
