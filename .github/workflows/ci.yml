name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-03-12
          components: rustfmt
      - run: cargo +nightly-2026-03-12 fmt --check

  clippy:
    name: Clippy
    runs-on: macos-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jackstay
        with:
          token: ${{ secrets.JACKSTAY_READ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: macos-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jackstay
        with:
          token: ${{ secrets.JACKSTAY_READ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - run: cargo build -p porthole --locked
      - run: cargo test --workspace --locked

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jackstay
        with:
          token: ${{ secrets.JACKSTAY_READ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev
      - run: cargo test --workspace --locked
      # Compile gate only: the runners have no DRM render node or PipeWire
      # session, so the backend's hardware-touching tests can't run here.
      - run: cargo build -p portholed --locked

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-jackstay
        with:
          token: ${{ secrets.JACKSTAY_READ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      # Capture is stubbed on Windows (Layer 1), so the whole workspace compiles
      # but several tests assert capture/Unix-socket behavior that differs under
      # the stub (portholed's capture-adjacent
      # route guards, the Unix-socket-path CLI tests). Until those are gated for
      # Windows, this job is a compile gate over every crate plus the portable
      # logic tests (core / protocol / the new transport crate) — enough to catch
      # a Windows build or wire regression. Widening test coverage is tracked as
      # a follow-up.
      - run: cargo build --workspace --locked
      - run: cargo test -p porthole-core -p porthole-protocol -p porthole-transport --locked
