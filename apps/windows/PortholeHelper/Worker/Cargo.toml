[package]
name = "porthole-console-worker"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "PortholeConsoleWorker"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_Com", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging", "Win32_System_StationsAndDesktops"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros"] }
